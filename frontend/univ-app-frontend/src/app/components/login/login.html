<div class="login-container" *ngIf="!isLoading">
  <div class="bg-text">UNCHK</div>

  <div class="login-overlay">
    <div class="login-top">
      <img src="logo.png" alt="UNCHK Logo" class="logo">
    </div>

    <div class="login-card">
      <h2>Connexion</h2>
      <p class="subtitle">Connectez-vous à votre espace</p>

      <div class="login-form">

        <div class="error-msg" *ngIf="error">
          <mat-icon>error</mat-icon>
          <span>{{ error }}</span>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nom d'utilisateur</mat-label>
          <input matInput [formControl]="usernameControl" placeholder="Votre identifiant">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" [formControl]="passwordControl">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <div class="remember-forgot">
          <label class="remember-me">
            <input type="checkbox" [(ngModel)]="rememberMe">
            <span>Se souvenir de moi</span>
          </label>
          <a class="forgot-link" (click)="onForgotPassword()">Mot de passe oublié ?</a>
        </div>

        <button mat-raised-button class="login-btn" (click)="onSubmit()">
          <mat-icon>login</mat-icon>
          Se connecter
        </button>

      </div>

      <p class="footer">© 2026 UNCHK — Tous droits réservés</p>
    </div>
  </div>
</div>

<!-- LOADER APRES LOGIN -->
<div class="page-loader" *ngIf="isLoading">
  <div class="loader-content">
    <img src="logo.png" alt="UNCHK Logo" class="loader-logo">
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
    <p class="loader-text">Connexion en cours...</p>
  </div>
</div>
