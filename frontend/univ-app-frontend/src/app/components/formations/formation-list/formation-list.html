<mat-toolbar color="primary">
  <button mat-icon-button (click)="retour()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Gestion des Formations</span>
  <span class="spacer"></span>
  <button mat-raised-button (click)="nouvelleFormation()">
    <mat-icon>add</mat-icon> Nouvelle Formation
  </button>
</mat-toolbar>

<div class="content">
  <mat-card class="filter-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Rechercher une formation</mat-label>
      <input matInput [(ngModel)]="searchQuery" (input)="filterFormations()" placeholder="Intitulé, niveau...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="filteredFormations" class="full-width">

        <ng-container matColumnDef="intitule">
          <th mat-header-cell *matHeaderCellDef>Intitulé</th>
          <td mat-cell *matCellDef="let f">{{ f.intitule }}</td>
        </ng-container>

        <ng-container matColumnDef="niveauEtudes">
          <th mat-header-cell *matHeaderCellDef>Niveau</th>
          <td mat-cell *matCellDef="let f">{{ f.niveauEtudes }}</td>
        </ng-container>

        <ng-container matColumnDef="typeFormation">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let f">
            <mat-chip>{{ f.typeFormation }}</mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="responsable">
          <th mat-header-cell *matHeaderCellDef>Responsable</th>
          <td mat-cell *matCellDef="let f">{{ f.responsableFormation }}</td>
        </ng-container>

        <ng-container matColumnDef="apprenants">
          <th mat-header-cell *matHeaderCellDef>Apprenants</th>
          <td mat-cell *matCellDef="let f">
            👨 {{ f.nbApprenantsHommes }} / 👩 {{ f.nbApprenantsFemmes }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let f">
            <button mat-icon-button color="warn" (click)="supprimerFormation(f.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="6" style="text-align:center; padding: 2rem;">
            Aucune formation trouvée
          </td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
