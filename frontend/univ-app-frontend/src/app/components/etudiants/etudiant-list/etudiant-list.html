<mat-toolbar color="primary">
  <button mat-icon-button (click)="retour()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Gestion des Étudiants</span>
  <span class="spacer"></span>
  <button mat-raised-button (click)="nouveauEtudiant()">
    <mat-icon>add</mat-icon> Nouvel Étudiant
  </button>
</mat-toolbar>

<div class="content">
  <mat-card class="filter-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Rechercher un étudiant</mat-label>
      <input matInput [(ngModel)]="searchQuery" (input)="filterEtudiants()" placeholder="Nom, prénom, INE...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </mat-card>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="filteredEtudiants" class="full-width">

        <ng-container matColumnDef="ine">
          <th mat-header-cell *matHeaderCellDef>INE</th>
          <td mat-cell *matCellDef="let e">{{ e.ine }}</td>
        </ng-container>

        <ng-container matColumnDef="nom">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let e">{{ e.nom }}</td>
        </ng-container>

        <ng-container matColumnDef="prenom">
          <th mat-header-cell *matHeaderCellDef>Prénom</th>
          <td mat-cell *matCellDef="let e">{{ e.prenom }}</td>
        </ng-container>

        <ng-container matColumnDef="formation">
          <th mat-header-cell *matHeaderCellDef>Formation</th>
          <td mat-cell *matCellDef="let e">{{ e.formation }}</td>
        </ng-container>

        <ng-container matColumnDef="promotion">
          <th mat-header-cell *matHeaderCellDef>Promotion</th>
          <td mat-cell *matCellDef="let e">{{ e.promotion }}</td>
        </ng-container>

        <ng-container matColumnDef="statut">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let e">
            <mat-chip [class]="'chip-' + e.statut?.toLowerCase()">
              {{ e.statut }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let e">
            <button mat-icon-button color="warn" (click)="supprimerEtudiant(e.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="7" style="text-align:center; padding: 2rem;">
            Aucun étudiant trouvé
          </td>
        </tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
